name: Debug-Tester (à la demande)

# L'agent Debug-Tester ne tourne JAMAIS automatiquement sur les PR.
# Il se lance uniquement quand un propriétaire ou collaborateur du dépôt
# écrit un commentaire commençant par « /debug-test » sur une pull request.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  debug-tester:
    name: Debug-Tester
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/debug-test') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Vérifier la présence du secret Claude
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret ANTHROPIC_API_KEY ou CLAUDE_CODE_OAUTH_TOKEN absent : Debug-Tester ne peut pas tourner"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer la branche de la PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: gh pr checkout "$PR_NUMBER"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            DEMANDE (commentaire de ${{ github.event.comment.user.login }}) :
            ${{ github.event.comment.body }}

            Lis `.claude/skills/debug-test/debug-tester.md` et applique son rôle, ses principes,
            ses 5 piliers et son format de rapport à cette PR (`gh pr diff`, `gh pr view`).
            Si la demande après « /debug-test » est vide, fais une revue complète :
            qualité du code, sécurité, tests manquants, état de la CI (`gh pr checks`), IA/ML si concerné.

            Publie :
            - un commentaire inline (`mcp__github_inline_comment__create_inline_comment`) pour chaque problème bloquant, avec la correction suggérée ;
            - un commentaire de synthèse unique (`gh pr comment`) en français et en bullet points, avec un verdict :
              ✅ Prêt à merger · ⚠️ Corrections mineures · ❌ Bloquant.
            Ne signale que des problèmes réels et vérifiés.
          claude_args: |
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Read,Grep,Glob"
