name: MLOps Continuous Integration & Model Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  ml_testing_pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Set up CML
      uses: iterative/setup-cml@v2

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov scikit-learn pandas numpy scipy

    - name: 1. Code Testing (Unit & Integration Tests)
      run: |
        # Validation du code avec pytest et mesure de la couverture
        pytest tests/ --doctest-modules --junitxml=junit/test-results.xml --cov=src/ --cov-report=xml

    - name: 2. Data Testing (Format, Schema & Missing Values)
      run: |
        # Vérification de la qualité des données (schéma, types, valeurs manquantes, dérive)
        python scripts/validate_data.py \
          --data-path data/processed/test_data.csv \
          --reference-path data/processed/train_data.csv

    - name: 3. Model Training & Evaluation
      run: |
        # Réentraînement et évaluation du modèle sur le jeu de test
        # Doit produire results/metrics.txt, results/confusion_matrix.png, results/roc_curve.png
        python scripts/train_and_evaluate.py

    - name: 4. Generate CML Report (Metrics & Visualizations)
      if: github.event_name == 'pull_request'
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Génération automatique d'un rapport visuel dans la PR via Iterative CML
        echo "## 📊 MLOps Test & Model Evaluation Report" > report.md

        echo "### 📈 Métriques de Performance" >> report.md
        cat results/metrics.txt >> report.md

        echo "### 📉 Matrice de Confusion & Courbe ROC" >> report.md
        echo '![](./results/confusion_matrix.png "Matrice de confusion")' >> report.md
        echo '![](./results/roc_curve.png "Courbe ROC")' >> report.md

        # Envoi du rapport en commentaire sur la Pull Request (les images sont publiées automatiquement)
        cml comment create report.md
